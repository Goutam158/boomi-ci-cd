name: Boomi CI/CD Pipeline

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch: # Allows manual triggering

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      BOOMI_BASE_URL: "https://api.boomi.com/api/rest/v1/{{ secrets.BOOMI_ACCOUNT_ID }}"
      COMPONENT_ID: "your-component-id-here"
      ENVIRONMENT_ID: "your-target-env-id-here"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # STEP 1: Create Packaged Component
      - name: Create Boomi Package
        id: create_package
        run: |
          RESPONSE=$(curl -s -X POST "${{ env.BOOMI_BASE_URL }}/PackagedComponent" \
            -u "${{ secrets.BOOMI_USERNAME }}:${{ secrets.BOOMI_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "componentId": "${{ env.COMPONENT_ID }}",
              "packageVersion": "1.0.${{ github.run_number }}",
              "notes": "Automated build from GitHub Actions"
            }')
          
          # Extract packageId from response
          PACKAGE_ID=$(echo $RESPONSE | jq -r '.packageId')
          echo "PACKAGE_ID=$PACKAGE_ID" >> $GITHUB_ENV
          echo "Created Package ID: $PACKAGE_ID"

      # STEP 2: Deploy Package to Environment
      - name: Deploy to Environment
        run: |
          curl -s -X POST "${{ env.BOOMI_BASE_URL }}/DeployedPackage" \
            -u "${{ secrets.BOOMI_USERNAME }}:${{ secrets.BOOMI_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "packageId": "${{ env.PACKAGE_ID }}",
              "environmentId": "${{ env.ENVIRONMENT_ID }}",
              "notes": "Deployed via GitHub Actions build ${{ github.run_number }}"
            }'
          echo "Successfully deployed package ${{ env.PACKAGE_ID }} to ${{ env.ENVIRONMENT_ID }}"
